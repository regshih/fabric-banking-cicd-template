name: Validate template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Validate Fabric definitions
        run: |
          python tests/validate_repo.py
          python tests/validate_public_repo.py

      - name: Install isolated security tools
        shell: bash
        run: |
          python -m venv /tmp/security-venv
          /tmp/security-venv/bin/python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Scan tracked files for secrets
        shell: bash
        run: /tmp/security-venv/bin/detect-secrets scan $(git ls-files) --exclude-files '.*\.terraform\.lock\.hcl$' > /tmp/secrets.json && python -c 'import json; d=json.load(open("/tmp/secrets.json")); assert not d["results"], d["results"]'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.1"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          for root in terraform/bootstrap terraform/environments/dev terraform/environments/prod; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: Scan Terraform configuration
        run: /tmp/security-venv/bin/checkov --directory terraform --framework terraform --compact --quiet
