name: Bug report
description: Report a reproducible problem in the template.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tenant IDs, customer data, or exploitable security details. Use private vulnerability reporting for security issues.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal sanitized reproduction.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Tool versions
      description: Terraform, provider, Python, and fabric-cicd versions.
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove IDs, URLs, tokens, state, and customer information before pasting logs.
