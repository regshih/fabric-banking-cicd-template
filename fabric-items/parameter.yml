find_replace:
  - find_value: "11111111-1111-4111-8111-111111111111"
    replace_value:
      DEV: "$items.Lakehouse.BankingLakehouse.id"
      PROD: "$items.Lakehouse.BankingLakehouse.id"

  - find_value: "00000000-0000-0000-0000-000000000000"
    replace_value:
      DEV: "$workspace.id"
      PROD: "$workspace.id"

  - find_value: "ea7e0343-6ccc-44ed-8bd4-1f572a8b9727"
    replace_value:
      DEV: "$items.Notebook.IngestTransactions.id"
      PROD: "$items.Notebook.IngestTransactions.id"
    item_type: "DataPipeline"

key_value_replace:
  - find_key: '$.variables[?(@.name=="SQL_ENDPOINT")].value'
    replace_value:
      DEV: "$items.Lakehouse.BankingLakehouse.sqlendpoint"
      PROD: "$items.Lakehouse.BankingLakehouse.sqlendpoint"
    item_type: "VariableLibrary"
    item_name: "BankingConfig"
    file_path: "BankingConfig.VariableLibrary/variables.json"

  - find_key: '$.variables[?(@.name=="LAKEHOUSE_ID")].value'
    replace_value:
      DEV: "$items.Lakehouse.BankingLakehouse.id"
      PROD: "$items.Lakehouse.BankingLakehouse.id"
    item_type: "VariableLibrary"
    item_name: "BankingConfig"
    file_path: "BankingConfig.VariableLibrary/variables.json"

  - find_key: '$.variableOverrides[?(@.name=="SQL_ENDPOINT")].value'
    replace_value:
      DEV: "$items.Lakehouse.BankingLakehouse.sqlendpoint"
      PROD: "$items.Lakehouse.BankingLakehouse.sqlendpoint"
    item_type: "VariableLibrary"
    item_name: "BankingConfig"
    file_path: "BankingConfig.VariableLibrary/valueSets/*.json"

  - find_key: '$.variableOverrides[?(@.name=="LAKEHOUSE_ID")].value'
    replace_value:
      DEV: "$items.Lakehouse.BankingLakehouse.id"
      PROD: "$items.Lakehouse.BankingLakehouse.id"
    item_type: "VariableLibrary"
    item_name: "BankingConfig"
    file_path: "BankingConfig.VariableLibrary/valueSets/*.json"
